{% extends "base.html" %}

<title >{% block title %}{{title}}{% endblock %} </title>


{% block content %}
<div class="container">
  <h1>{{ title }}</h1>
  <!-- This is where our form will go. -->
  <form method="POST" action="{{ url_for('login') }}" novalidate>
    {% from 'bootstrap5/form.html' import render_form %}
    {{ render_form(form) }}
  </form>
</div>
{% endblock %}
